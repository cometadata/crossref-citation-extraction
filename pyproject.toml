[project]
name = "crossref-arxiv-citations-hf-job"
version = "0.1.0"
description = "Hugging Face Job orchestration for full DataCite citation mining of Crossref snapshots, publishing the DataCite and arXiv citation datasets"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3,<2",
  "huggingface-hub>=1.23.0,<2",
  "pyarrow>=20,<22",
  "requests>=2.32,<3",
  "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
